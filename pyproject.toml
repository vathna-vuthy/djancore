[project]
name = "djancore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "djangorestframework-types>=0.9.0",
    "pyright>=1.1.411",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py314"
line-length = 88
include = ["apps/**/*.py", "config/**/*.py", "manage.py"]
exclude = [
    ".git",
    ".venv",
    ".agents",
    "__pycache__",
    "*/migrations/*",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line length (handled by formatter)
    "RUF012", # Mutable class attributes on models/serializers
    "DJ012",  # Model declaration order flexibility for custom managers
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pyright]
include = ["apps", "config", "manage.py"]
exclude = [
    "**/migrations",
    ".venv",
]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
reportAssignmentType = false
reportReturnType = false
reportOptionalSubscript = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportArgumentType = false
