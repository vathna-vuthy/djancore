name: 💡 Feature Request
description: Suggest a new idea, feature, or enhancement for djancore
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to djancore!

  - type: input
    id: app
    attributes:
      label: Target App / Module
      description: Which app would this feature belong to?
      placeholder: "e.g. apps.notifications, apps.core, new app"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
