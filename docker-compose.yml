services:
  postgres:
    image: postgres:16-alpine
    container_name: djancore_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=djancore
      - POSTGRES_USER=djancore
      - POSTGRES_PASSWORD=djancore_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djancore -d djancore"]
      interval: 5s
      timeout: 5s
      retries: 5

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: djancore_smtp4dev
    restart: unless-stopped
    ports:
      - "5000:80"    # Webmail UI
      - "2525:25"    # SMTP Server
    environment:
      - ServerOptions__HostName=smtp4dev
      - ServerOptions__Port=25
    volumes:
      - smtp4dev-data:/smtp4dev

  redis:
    image: redis:7-alpine
    container_name: djancore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  smtp4dev-data:
  redis-data:
